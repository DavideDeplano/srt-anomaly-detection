random_seed: 42

# Project paths
paths:
  data: data                            # Raw and preprocessed datasets
  models: models                        # Stored models (UMAP, KDE, GMM, etc.)
  results: results                      # Output files, rankings, figures
  logs: logs                            # Log files
  real_png_dir: "/content/davide/srt-anomaly-detection/data/real_candidates"   # Directory with real candidate PNGs
  #real_png_dir: "/content/davide/srt-anomaly-detection/data/custom_candidates"
  #real_png_dir: "/content/davide/srt-anomaly-detection/data/injection_test"

simulation:
  output_cadences_dir: "simulated/cadences"
  output_waterfall_plots_dir: "simulated/waterfall_plots"

  # Number of base panel sets (each expanded into mask_combinations cadences)
  n_panel_sets: 20000

  # Frame parameters for synthetic panels
  fchans: 80
  tchans: 16
  df_hz: 2.7939677238464355
  dt_s: 18.253611008
  fch1_mhz: 6500.0
  noise_mean: 10.0

  # Signal parameter ranges
  amplitude_factor: [4.0, 10.0]
  drift_rate_hz_s: [-4.0, 4.0]
  width_hz: [1.0, 20.0]

  # Cadence structure
  panels_per_cadence: 6          # 3 ON + 3 OFF
  mask_combinations: 64          # 2^6

# Ranker configuration
ranker:
  top_k: 1000                    # Number of top candidates to export
  control_k: 3000
  top_percentile_freq: 0.01
  top_percentile_sim: 0.01

# Filters configuration
filters:
  # Density filter (UMAP + KDE on 15-D CC features)
  density:
    # UMAP hyperparameters (paper 25 - 0.01 - canberra)
    n_neighbors: 25
    min_dist: 0.1
    umap_metric: "correlation"
    n_components: 2

    # KDE hyperparameters
    kde_bandwidth: 0.30
    kernel: "exponential"

    # Category configuration
    threshold: 0.0618             # Threshold for only-on class detection
    only_on_category: 42          # Pattern ID used for ON-OFF-ON-OFF-ON-OFF
    only_off_category: 21         # Pattern ID used for OFF-ON-OFF-ON-OFF-ON

    # Path
    umap_model_path: "models/umap_density.pkl"
    kde_models_dir: "models/kde_density/"

  # Frequency filter (GMM bagging on per-band frequencies)
  frequency:
    # Number of GMM components per band
    n_components_C: 10
    n_components_K: 10

    # Bagging settings
    n_bags: 10                    # Number of GMMs per band
    bag_size: 5000                # Size of each subsample

    # Path
    gmm_model_path: "models/gmm_frequency.joblib"

  # Similarity filter (UMAP on downsampled panels)
  similarity:
    # UMAP hyperparameters
    n_neighbors: 25
    min_dist: 0.01
    umap_metric: "euclidean"      # 2D embedding of the 6 panels
    n_components: 2

    #Path
    umap_model_path: "models/umap_similarity.joblib"

    # Scoring options
    rescale_0_1: true             # Normalize similarity score in [0,1]

  # Autoencoder filter 
  autoencoder:
    model_path: "models/autoencoder.keras"
    meta_path: "models/autoencoder_meta.joblib"
    tuner_dir: "models/ae_tuner"

# Logging
logging:
  level: INFO
  file: logs/run.log

